<title>Closing Projects Responsibly</title>
<style>
:root{--n:#123149;--n2:#0b2235;--t:#168b89;--g:#2f8f5b;--o:#e7862f;--r:#b93f45;--bg:#eef2f4;--ink:#182832;--w:#fff}*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Arial,Helvetica,sans-serif;background:#dce5e9;color:var(--ink);overflow:hidden}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:4px solid #ffd166;outline-offset:2px}#app{height:100%;display:grid;grid-template-rows:44px 1fr 58px}.top{background:var(--n2);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:10px;font-size:14px}.timer{font-weight:800;font-variant-numeric:tabular-nums;background:#ffffff1d;padding:6px 9px;border-radius:8px}.tiny{background:transparent;border:1px solid #ffffff55;color:#fff;border-radius:7px;padding:5px 8px}.stage{min-height:0;display:grid;place-items:center;padding:10px}.deck{position:relative;width:min(100%,calc((100vh - 122px)*16/9));aspect-ratio:16/9;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 14px 38px #12314928}.slide{position:absolute;inset:0;padding:4.3% 5.2% 4.7%;display:flex;flex-direction:column;background:#fff;opacity:0;transform:translateX(16px);pointer-events:none;transition:.22s}.slide.on{opacity:1;transform:none;pointer-events:auto}.soft{background:linear-gradient(#fff,#f3f7f8)}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(36px,4.6vw,70px);line-height:1.04;color:var(--n2);margin-bottom:18px}h2{font-size:clamp(29px,3.1vw,49px);line-height:1.08;color:var(--n);margin-bottom:18px}h3{font-size:clamp(19px,1.65vw,27px);color:var(--n);margin-bottom:8px}p,li,label,td,th{font-size:clamp(17px,1.45vw,24px);line-height:1.3}ul{margin:0;padding-left:1.15em}li{margin:.22em 0}.center{text-align:center;align-items:center;justify-content:center}.sub{font-size:clamp(23px,2.45vw,39px);font-weight:800;color:var(--t)}.big{font-size:clamp(25px,2.65vw,43px);font-weight:900;line-height:1.18;text-align:center;color:var(--n)}.muted{color:#62737d}.strong{font-weight:800}.push{margin-top:auto}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:15px}.act{display:inline-flex;gap:6px;align-items:center;background:#fff4cc;border:1px solid #efd36b;color:#684f00;border-radius:999px;padding:7px 11px;font-size:14px;font-weight:900;white-space:nowrap}.act:before{content:'✋'}.time{position:absolute;top:2.1%;right:2%;font-size:12px;background:#edf2f4;color:#53656f;border-radius:999px;padding:5px 9px;font-weight:800}.cite{position:absolute;bottom:1.5%;left:5.2%;right:5.2%;border-top:1px solid #dce4e8;padding-top:6px;color:#63747d;font-size:clamp(10px,.72vw,13px);line-height:1.15}.g2,.g3,.g4,.g5{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g5{grid-template-columns:repeat(5,1fr)}.card{background:#fff;border:1px solid #dce5e9;border-radius:17px;padding:16px;box-shadow:0 5px 16px #12314910}.card p,.card li{font-size:clamp(15px,1.12vw,19px)}.teal{border-top:7px solid var(--t);background:linear-gradient(#fff,#e3f5f3)}.green{border-top:7px solid var(--g);background:linear-gradient(#fff,#e9f6ed)}.orange{border-top:7px solid var(--o);background:linear-gradient(#fff,#fff0df)}.red{border-top:7px solid var(--r);background:linear-gradient(#fff,#fdebed)}.strip{border-left:8px solid var(--o);background:#fff0df;border-radius:13px;padding:13px 17px;font-size:clamp(17px,1.25vw,21px);font-weight:800;margin-top:14px}.strip.good{border-color:var(--g);background:#e9f6ed}.strip.bad{border-color:var(--r);background:#fdebed}.def{background:linear-gradient(135deg,var(--n),var(--n2));color:#fff;border-radius:22px;padding:23px 28px;text-align:center;font-size:clamp(21px,2vw,33px);line-height:1.27;font-weight:800;box-shadow:0 10px 28px #1231492b}.life,.flow,.asset{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;margin:20px 0}.pill{background:var(--bg);border-radius:13px;p -weight:900}.criteria div:nth-child(even){background:var(--t)}.formula{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:20px}.formula span{background:var(--bg);padding:11px 14px;border-radius:11px;font-weight:900}.formula b{color:var(--o);font-size:26px}.triangle{position:relative;width:420px;max-width:100%;height:260px;margin:auto}.tri{position:absolute;width:185px;padding:16px;border-radius:16px;text-align:center;color:#fff;font-weight:900}.ta{left:118px;top:0;background:var(--t)}.tb{left:0;bottom:0;background:var(--n)}.tc{right:0;bottom:0;background:var(--g)}.tm{position:absolute;left:110px;top:108px;width:200px;background:#fff;border:3px solid var(--o);border-radius:50%;padding:16px 9px;text-align:center;font-weight:900;color:var(--n);z-index:2}.folders{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.folder{border:0;background:transparent;text-align:left;padding:0}.fs{height:68px;border-radius:9px;background:#f2b84b;position:relative;box-shadow:0 6px 14px #59471325}.fs:before{content:'';position:absolute;top:-9px;left:8px;width:45%;height:17px;border-radius:7px 7px 0 0;background:#dca43e}.folder:hover .fs,.folder.active .fs{transform:translateY(-3px)}.fl{font-size:clamp(11px,.84vw,15px);font-weight:900;color:var(--n);margin-top:7px;line-height:1.1}.folderout{margin-top:13px;background:var(--n2);color:#fff;border-radius:13px;padding:13px 17px;min-height:65px;font-size:clamp(14px,1.05vw,18px)}.acc{display:grid;grid-template-columns:1fr 1fr;gap:7px 12px;overflow:auto}details{border:1px solid #d9e3e7;border-radius:10px;background:#fff}summary{padding:10px 13px;font-size:clamp(14px,1vw,18px);font-weight:900;color:var(--n);cursor:pointer}details li{font-size:clamp(12px,.86vw,16px)}code{display:block;background:var(--n2);color:#fff;border-radius:13px;padding:16px;text-align:center;font-size:clamp(17px,1.5vw,24px);white-space:normal;word-break:break-word}.scenario{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.scenario button{background:#fff;border:2px solid #dce5e9;border-radius:13px;padding:10px;text-align:left;font-size:clamp(12px,.88vw,16px);line-height:1.2}.scenario button.sel,.scenario button:hover{border-color:var(--o);background:#fff0df}table{width:100%;border-collapse:collapse;border:1px solid #dce5e9}th{background:var(--n);color:#fff;text-align:left;padding:9px}td{padding:8px;border-top:1px solid #dce5e9;vertical-align:top}td,th{font-size:clamp(11px,.8vw,15px);line-height:1.2}tr:nth-child(even) td{background:#f6f9fa}.checks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;overflow:auto}.cg{border:1px solid #dce5e9;border-radius:11px;padding:9px}.cg h3{font-size:clamp(13px,.95vw,17px);color:var(--t);margin:0 0 5px}.ci{display:flex;gap:6px;align-items:flex-start;margin:4px 0;font-size:clamp(11px,.76vw,14px);line-height:1.15}.ci input{width:17px;height:17px;accent-color:var(--g);flex:0 0 auto}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btn{border:0;background:var(--n);color:#fff;border-radius:9px;padding:8px 11px;font-size:13px;font-weight:900}.btn.alt{background:var(--t)}.btn.warn{background:var(--o)}.action input{width:100%;padding:7px;border:1px solid #cbd8de;border-radius:7px;font-size:14px}.reflection{width:100%;min-height:160px;border:3px dashed #94c8c5;border-radius:19px;padding:18px;font-size:clamp(21px,1.9vw,31px);resize:none}.principle{display:none;min-height:210px;border-radius:22px;background:linear-gradient(135deg,var(--n),var(--t));color:#fff;padding:24px;text-align:center;align-items:center;justify-content:center;font-size:clamp(25px,2.65vw,42px);font-weight:900;line-height:1.2}.principle.show{display:flex}.refs{columns:2;column-gap:30px}.ref{break-inside:avoid;margin-bottom:9px;font-size:clamp(10px,.7vw,13px);line-height:1.2}.ref a{color:var(--t);word-break:break-all}.notes{display:none;position:absolute;z-index:20;left:18px;right:18px;bottom:16px;max-height:36%;overflow:auto;background:#0b2235f7;color:#fff;border-radius:14px;padding:15px 18px;box-shadow:0 10px 30px #0004}.notes.open{display:block}.notes button{float:right;border:0;background:transparent;color:#fff;font-size:23px}.notes h3{color:#fff;margin:0 0 6px}.notes div{font-size:15px;line-height:1.4}.controls{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:#fff;padding:7px 13px;border-top:1px solid #cad6dc}.nav,.util{display:flex;gap:7px}.ctl{border:0;background:var(--n);color:#fff;border-radius:9px;padding:9px 12px;font-size:13px;font-weight:900}.ctl:hover{background:var(--t)}.prog{display:flex;align-items:center;gap:10px}.track{height:8px;background:#dce5e9;border-radius:999px;flex:1;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--t),var(--g));width:0}.count{font-size:13px;font-weight:900;color:var(--n);white-space:nowrap}@media(max-width:900px){.g4,.scenario{grid-template-columns:repeat(2,1fr)}.checks{grid-template-columns:repeat(2,1fr)}.folder{font-size:11px}.slide{padding:4% 4.6% 5%}}@media print{html,body{height:auto;overflow:visible;background:#fff}#app{display:block;height:auto}.top,.controls,.notes{display:none!important}.stage{display:block;padding:0}.deck{width:100%;aspect-ratio:auto;overflow:visible;box-shadow:none}.slide{position:relative;opacity:1!important;transform:none!important;pointer-events:auto;width:100%;height:7.5in;page-break-after:always;border:1px solid #bbb}.principle{display:flex!important;min-height:55px;margin:3px;font-size:19px}#pollReveal{display:block!important}}

<body><div id="app"><header class="top"><strong>Closing Projects Responsibly — CSO Online Training</strong><div><span>Session timer </span><span class="timer" id="timer">00:00:00</span> <button class="tiny" id="start">Start</button> <button class="tiny" id="pause">Pause</button> <button class="tiny" id="reset">Reset</button></div></header><main class="stage"><div class="deck" id="deck"><aside class="notes" id="notes"><button id="closeNotes">×</button><h3>Speaker notes</h3><div id="noteText"></div></aside></div></main><footer class="controls"><div class="nav"><button class="ctl" id="prev">← Previous</button><button class="ctl" id="next">Next →</button></div><div class="prog"><span class="count" id="count"></span><div class="track"><div class="fill" id="fill"></div></div></div><div class="util"><button class="ctl" id="noteBtn">Notes</button><button class="ctl" onclick="print()">Print</button><button class="ctl" id="full">Full screen</button></div></footer></div>
<script>
const S=[
{t:'Closing Projects Responsibly',time:'2 min',cls:'center soft',b:`<div class="muted strong">Two-hour online session for Civil Society Organizations</div><h1>Closing Projects Responsibly</h1><p class="sub">Project Closure, Documentation, Handover and Organizational Learning</p><p class="strong muted">Practical guidance for Civil Society Organizations</p><div class="life"><span class="pill">Planning</span><span class="arrow">→</span><span class="pill">Implementation</span><span class="arrow">→</span><span class="pill">Monitoring</span><span class="arrow">→</span><span class="pill done">Closure</span><span class="arrow">→</span><span class="pill">Learning</span></div>`,n:'Welcome participants. Emphasize that closure is part of the project lifecycle, not only an administrative task after activities end. Example: the last workshop can finish while reporting, invoices, assets and acceptance remain open. Ask participants to type their role in chat. Time: 2 minutes.'},
{t:'When is a project really closed?',time:'5 min',a:1,cls:'center',b:`<p class="big">Is a project closed when the final activity has been completed?</p><div class="poll"><button data-p="Yes">Yes</button><button data-p="No">No</button><button data-p="It depends">It depends</button></div><p id="pollStatus" class="muted">Select an option or respond in the meeting chat.</p><div id="pollReveal" class="strip good">Completing the final activity means implementation may have ended, but formal project closure may still require reporting, reconciliation, handover, archiving and donor acceptance.</div>`,n:'Use the opening poll or meeting chat. Ask one or two participants why they chose their answer. Main message: activity completion and formal closure are different milestones. Time: 5 minutes.'},
{t:'The activity ended, but what is still open?',time:'4 min',cls:'soft',b:`<div class="g4"><div class="card teal"><h3>1. Final reports</h3></div><div class="card orange"><h3>2. Unpaid invoices</h3></div><div class="card orange"><h3>3. Staff advances</h3></div><div class="card teal"><h3>4. Unverified results</h3></div><div class="card green"><h3>5. Assets requiring transfer</h3></div><div class="card orange"><h3>6. Open contracts</h3></div><div class="card teal"><h3>7. Community communication</h3></div><div class="card red"><h3>8. Project files and personal data</h3></div></div><div class="strip good push">Project closure begins before the final activity and continues until all obligations have been completed.</div>`,n:'Explain that operational, financial, data and stakeholder obligations can remain open. Ask for one example from a previous project. Time: 4 minutes.'},
{t:'By the end of this session, participants will be able to:',time:'3 min',b:`<div class="g2"><div class="card teal"><h3>1. Explain</h3><p>Explain the difference between project completion and project closure.</p></div><div class="card teal"><h3>2. Identify</h3><p>Identify the main closure requirements.</p></div><div class="card green"><h3>3. Organize</h3><p>Organize a complete project closure file.</p></div><div class="card orange"><h3>4. Recognize</h3><p>Recognize documentation and compliance risks.</p></div><div class="card green" style="grid-column:1/-1"><h3>5. Prepare</h3><p>Prepare a practical organizational closure action plan.</p></div></div>`,n:'Connect the objectives to the practical checklist and action plan participants can reuse. Time: 3 minutes.'},
{t:'Our journey today',time:'2 min',cls:'soft',b:`<div class="timeline"><div class="node"><div class="dot">1</div><b>Understanding closure</b></div><div class="node"><div class="dot">2</div><b>Programmatic and MEAL closure</b></div><div class="node"><div class="dot">3</div><b>Financial, contractual and asset closure</b></div><div class="node"><div class="dot">4</div><b>Documentation and archiving</b></div><div class="node"><div class="dot">5</div><b>Closure risk exercise</b></div><div class="node"><div class="dot">6</div><b>Action planning</b></div></div><div class="strip push">The session combines explanation, polls, chat questions, a group exercise, a practical checklist and an individual action plan.</div>`,n:'Briefly explain the six sections and the online interaction methods. Time: 2 minutes.'},
{t:'Project closure is more than ending activities',time:'5 min',b:`<div class="def">Project closure is the structured process of completing project obligations, confirming results, reconciling finances, managing assets, organizing records, communicating exit arrangements and capturing learning.</div><div class="g4" style="margin-top:16px"><div class="card">Activities</div><div class="card">Results</div><div class="card">Finance</div><div class="card">Contracts</div><div class="card">Assets</div><div class="card">Communities</div><div class="card">Documentation</div><div class="card">Learning</div></div>`,c:'Source: UNDP, Close and Transition of a Development Project.',n:'Present closure as a cross-functional process. Example: a deliverable still needs evidence, acceptance, payment, archiving and learning. Time: 5 minutes.'},
{t:'Three stages of project closure',time:'6 min',cls:'soft',b:`<div class="steps"><div class="step"><div class="num">01</div><h3>Operational completion</h3><ul><li>Activities stop</li><li>Services end</li><li>Deliverables are produced</li></ul></div><div class="step"><div class="num">02</div><h3>Administrative and financial closure</h3><ul><li>Reports are finalized</li><li>Payments and advances are settled</li><li>Contracts and assets are closed</li></ul></div><div class="step"><div class="num">03</div><h3>Formal closure</h3><ul><li>Donor comments are addressed</li><li>Final deliverables are accepted</li><li>Files are archived</li><li>Closure is formally confirmed</li></ul></div></div><div class="strip">The project end date does not always equal the formal closure date.</div>`,c:'Source: UNDP, Close and Transition Policy and Procedures.',n:'Explain the three stages. Example: a project end date may be 30 June while donor acceptance arrives later. Ask which stage creates the greatest delay. Time: 6 minutes.'},
{t:'A complete project closure covers eight areas',time:'5 min',a:1,b:`<div class="wheel"><div>1. Programmatic closure</div><div>2. Results and MEAL closure</div><div>3. Financial closure</div><div>4. Contract and staff closure</div><div>5. Asset closure</div><div>6. Community and stakeholder exit</div><div>7. Documentation and data protection</div><div>8. Learning and sustainability</div></div><div class="strip push">Chat question: Which component is usually the most difficult for your organization?</div>`,n:'Emphasize cross-functional ownership. Use the chat question and identify patterns across program, MEAL, finance, administration, HR and safeguarding. Time: 5 minutes.'},
{t:'Did we complete what we promised?',time:'5 min',cls:'soft',b:`<div class="g3"><div class="card teal"><p>Were all planned activities completed?</p></div><div class="card green"><p>Were all deliverables produced?</p></div><div class="card orange"><p>Were changes formally approved?</p></div><div class="card orange"><p>Were incomplete activities explained?</p></div><div class="card green"><p>Were outputs reviewed and accepted?</p></div><div class="card teal"><p>Were project partners informed?</p></div></div><div class="strip good">The final report should explain performance, changes, results, risks, exit arrangements and lessons—not only list activities.</div>`,c:'Source: UNHCR, Project Closure Guidance for Partners.',n:'Programmatic closure checks delivery against approved commitments and explains deviations. Example: a cancelled activity should be linked to an approved change or explained. Time: 5 minutes.'},
{t:'What should support programmatic completion?',time:'4 min',b:`<div class="g5"><div class="card"><h3>Agreement</h3><p>Approved proposal and agreement</p></div><div class="card"><h3>Planning</h3><p>Workplan and amendments</p></div><div class="card"><h3>Activities</h3><p>Activity reports and attendance sheets</p></div><div class="card"><h3>Delivery</h3><p>Distribution records and deliverables</p></div><div class="card"><h3>Monitoring</h3><p>Monitoring reports</p></div><div class="card" style="grid-column:2/4"><h3>Reporting</h3><p>Final narrative report</p></div><div class="card"><h3>Acceptance</h3><p>Donor acceptance</p></div></div><div class="strip bad push">An activity mentioned in the final report must be supported by accessible evidence.</div>`,n:'Show how claims connect to records. Example: an attendance sheet without a date, location or project name may be difficult to authenticate. Time: 4 minutes.'},
{t:'Can we prove the results?',time:'7 min',cls:'soft',b:`<div class="flow"><span class="pill">Raw data</span><span class="arrow">→</span><span class="pill">Data cleaning</span><span class="arrow">→</span><span class="pill">Verification</span><span class="arrow">→</span><span class="pill">Final indicator values</span><span class="arrow">→</span><span class="pill">Final report</span></div><div class="g4"><div class="card">Update the indicator tracking table</div><div class="card">Verify unique beneficiary numbers</div><div class="card">Remove duplicates</div><div class="card">Complete disaggregation</div><div class="card">Compare targets and achievements</div><div class="card">Document limitations</div><div class="card">Archive tools and datasets</div><div class="card">Complete endline or final assessment where required</div></div>`,c:'Source: IFRC, Project/Programme Monitoring and Evaluation Guide.',n:'Explain the chain from source data to final reporting. Example: compare beneficiary database totals with the indicator table and narrative report. Ask who performs the final data-quality check. Time: 7 minutes.'},
{t:'Before reporting a final result, ask:',time:'6 min',b:`<div class="g2"><div class="card teal"><ol><li>What exactly are we claiming?</li><li>How is the indicator defined?</li><li>What is the evidence source?</li><li>Can the evidence be accessed?</li></ol></div><div class="card green"><ol start="5"><li>Can the result be recalculated?</li><li>Have duplicates been removed?</li><li>Does the database match the report?</li><li>Are limitations clearly explained?</li></ol></div></div><div class="def push" style="font-size:clamp(20px,1.75vw,28px)">Every reported result should be traceable from the report back to the source evidence.</div>`,n:'Traceability and reproducibility are central. Demonstrate how to move backward from a reported indicator to the database, tool and original record. Time: 6 minutes.'},
{t:'Example: “500 women completed entrepreneurship training”',time:'6 min',cls:'soft',b:`<div class="compare"><div class="side weak"><h3>⚠ Weak evidence</h3><ul><li>One group photograph</li><li>Estimated participant total</li><li>No completion definition</li><li>Several separate attendance files</li><li>Possible duplicate names</li></ul></div><div class="side strongside"><h3>✓ Strong evidence</h3><ul><li>Clear definition of completion</li><li>Unique participant database</li><li>Attendance requirement</li><li>Training dates and locations</li><li>Disaggregated records</li><li>Deduplication process</li><li>Reproducible total</li></ul></div></div><div class="strip">A photograph may show that an activity occurred, but it does not prove the total number of unique participants who completed it.</div>`,n:'Evidence must match the claim. Ask what additional evidence participants would request. Time: 6 minutes.'},
{t:'What should we learn before the team leaves?',time:'6 min',b:`<div class="criteria"><div>Relevance</div><div>Coherence</div><div>Effectiveness</div><div>Efficiency</div><div>Impact</div><div>Sustainability</div></div><div class="g5" style="margin-top:16px"><div class="card"><h3>What worked?</h3></div><div class="card"><h3>What did not work?</h3></div><div class="card"><h3>Why?</h3></div><div class="card"><h3>What should be repeated?</h3></div><div class="card"><h3>What should change?</h3></div></div>`,c:'Source: OECD DAC, Better Criteria for Better Evaluation.',n:'Capture learning while staff, partners and evidence remain available. Example: an activity may be effective but too costly to sustain. Time: 6 minutes.'},
{t:'A lesson should explain what happened and what to do differently',time:'4 min',cls:'soft',b:`<div class="compare"><div class="side weak"><h3>Weak statement</h3><p class="big">“Attendance was low.”</p></div><div class="side strongside"><h3>Strong lesson</h3><p>“Scheduling livelihood sessions during working hours reduced attendance among employed participants. Future sessions should be scheduled after working hours or during weekends following consultation with participants.”</p></div></div><div class="formula"><span>Evidence</span><b>+</b><span>Explanation</span><b>+</b><span>Future recommendation</span><b>=</b><span>Useful lesson</span></div>`,n:'Convert a vague observation into an evidence-based recommendation using the formula. Time: 4 minutes.'},
{t:'Can every financial transaction be explained and reconciled?',time:'6 min',b:`<div class="g3"><div class="card green"><ul><li>Record all expenditure</li><li>Clear staff and partner advances</li><li>Reconcile bank and cash balances</li></ul></div><div class="card teal"><ul><li>Address outstanding invoices</li><li>Confirm liabilities</li><li>Explain budget variances</li></ul></div><div class="card orange"><ul><li>Calculate unspent balances</li><li>Complete financial reporting</li><li>Address audit requirements</li></ul></div></div>`,c:'Source: FCDO, Programme Operating Framework.',n:'Financial closure confirms completeness, eligibility, reconciliation and outstanding obligations. Example: record liabilities for services delivered before the end date. Time: 6 minutes.'},
{t:'Common financial closure risks',time:'5 min',cls:'soft',b:`<div class="g3"><div class="card orange"><h3>Missing invoices</h3></div><div class="card red"><h3>Uncleared advances</h3></div><div class="card orange"><h3>Unpaid suppliers</h3></div><div class="card red"><h3>Expenses after the project end date</h3></div><div class="card red"><h3>Unapproved budget reallocations</h3></div><div class="card orange"><h3>Ledger and report differences</h3></div><div class="card orange"><h3>Unsupported payroll</h3></div><div class="card orange"><h3>Unexplained underspending</h3></div><div class="card red"><h3>Unrecorded liabilities</h3></div></div><div class="strip bad">Spending the full budget does not prove successful delivery, and successful activities do not remove the need for valid financial evidence.</div>`,n:'Ask which red flag is most common during the last project month. Time: 5 minutes.'},
{t:'Close responsibilities, not only contracts',time:'5 min',b:`<div class="compare"><div class="side strongside"><h3>Contracts</h3><ul><li>Confirm completion</li><li>Review final deliverables</li><li>Obtain acceptance</li><li>Settle payments</li><li>Archive agreements and amendments</li><li>Document disputes or pending claims</li></ul></div><div class="side" style="background:#e3f5f3;border:2px solid #abd9d7"><h3>Staff</h3><ul><li>Confirm final responsibilities</li><li>Complete handover notes</li><li>Return equipment</li><li>Review system access</li><li>Transfer project files</li><li>Maintain confidentiality obligations</li></ul></div></div>`,n:'Closure transfers knowledge, property, responsibilities and access. Example: a departing MEAL officer hands over datasets, calculations and approved access credentials. Time: 5 minutes.'},
{t:'Every project asset needs a documented final decision',time:'6 min',cls:'soft',b:`<div class="asset"><span class="pill">Purchase</span><span class="arrow">→</span><span class="pill">Registration</span><span class="arrow">→</span><span class="pill">Use</span><span class="arrow">→</span><span class="pill">Physical verification</span><span class="arrow">→</span><span class="pill done">Transfer or disposal</span></div><div class="g5"><div class="card">Description<br>Serial number</div><div class="card">Location<br>Condition</div><div class="card">Custodian<br>Ownership</div><div class="card">Donor requirement<br>Final decision</div><div class="card">Approval<br>Handover evidence</div></div>`,c:'Sources: FCDO, Programme Operating Framework; UNDP, Close and Transition Visual Guide.',n:'Asset closure requires verification, authorization and evidence. Example: match tablet serial numbers to the register and signed returns. Time: 6 minutes.'},
{t:'Assets may be:',time:'4 min',b:`<div class="g3"><div class="card green"><h3>Retained</h3><p>Retained by the organization</p></div><div class="card teal"><h3>Partner transfer</h3><p>Transferred to a partner</p></div><div class="card teal"><h3>Public transfer</h3><p>Transferred to a public institution</p></div><div class="card green"><h3>Beneficiary transfer</h3><p>Transferred to beneficiaries</p></div><div class="card orange"><h3>Returned</h3><p>Returned to the donor</p></div><div class="card orange"><h3>Disposed</h3><p>Sold or disposed of when authorized</p></div></div><div class="strip bad">Do not make informal asset transfers. Review the agreement and obtain the required approval first.</div>`,n:'Asset options depend on ownership rules and the agreement. Example: partner transfer may require donor approval and a signed handover. Time: 4 minutes.'},
{t:'How will communities and partners experience project closure?',time:'6 min',cls:'soft',b:`<div class="g4"><div class="card">Have participants been informed?</div><div class="card">Which services will stop?</div><div class="card">Which services will continue?</div><div class="card">Who will take over responsibilities?</div><div class="card">Have open referrals been transferred?</div><div class="card">Have local authorities been informed?</div><div class="card">Are complaint channels closing or changing?</div><div class="card red">Are safeguarding concerns being handled safely?</div></div>`,c:'Source: UNHCR, Project Closure Guidance for Partners.',n:'Closure is experienced by communities, not only donors and staff. Example: communicate a hotline closure date and alternative channel. Ask how early communities should be informed. Time: 6 minutes.'},
{t:'Project closure should not create new harm',time:'5 min',b:`<div class="g5"><div class="card orange"><h3>Sudden service discontinuation</h3></div><div class="card orange"><h3>False expectations</h3></div><div class="card red"><h3>Abandoned safeguarding cases</h3></div><div class="card red"><h3>Unclear referral pathways</h3></div><div class="card red"><h3>Exposure of confidential data</h3></div></div><div class="def push" style="font-size:clamp(20px,1.8vw,29px)">Exit communication, referral handover and safeguarding responsibilities are part of project closure.</div>`,n:'Apply do no harm to service discontinuation, expectations, referrals and data. Example: open safeguarding cases require confidential handover, not a general folder. Time: 5 minutes.'},
{t:'Documentation connects activities, results and expenditure',time:'6 min',cls:'soft',b:`<div class="g2" style="align-items:center"><div class="triangle"><div class="tri ta">MEAL evidence</div><div class="tri tb">Programmatic records</div><div class="tri tc">Financial evidence</div><div class="tm">One consistent project story</div></div><div class="card teal"><h3>Strong documentation demonstrates that:</h3><ul><li>activities were implemented;</li><li>results are credible;</li><li>expenditure is eligible;</li><li>decisions were approved;</li><li>the organization can respond to audits and verification.</li></ul></div></div>`,c:'Source: European Commission, Annotated Grant Agreement, Article 20.',n:'Programmatic, MEAL and financial records should tell the same story. Example: training days, participants and related costs should match. Time: 6 minutes.'},
{t:'Strong evidence is:',time:'5 min',a:1,b:`<div class="g2"><div class="card teal"><h3>Complete</h3><p>All required information is available.</p></div><div class="card green"><h3>Accurate</h3><p>Information is correct and consistent.</p></div><div class="card orange"><h3>Authentic</h3><p>The document is genuine and traceable.</p></div><div class="card"><h3>Accessible</h3><p>Authorized staff can retrieve it when needed.</p></div></div><div class="strip">Chat question: Which quality is most often missing in project documentation?</div>`,n:'Use the chat question and ask for one example. Main message: evidence must be complete, correct, genuine and retrievable. Time: 5 minutes.'},
{t:'Recommended project closure folder structure',time:'7 min',a:1,cls:'soft',b:`<div class="folders" id="folders"><button class="folder" data-d="Signed agreement; approved proposal; budget; logframe; amendments; donor approvals"><div class="fs"></div><div class="fl">1. Agreement and approvals</div></button><button class="folder" data-d="Workplans; activity reports; attendance sheets; distribution records; monitoring reports; deliverables"><div class="fs"></div><div class="fl">2. Programmatic implementation</div></button><button class="folder" data-d="MEAL plan; indicator definitions; beneficiary database; tools and datasets; data-quality checks; evaluation or final review"><div class="fs"></div><div class="fl">3. MEAL and results</div></button><button class="folder" data-d="Financial reports; ledger; bank reconciliation; invoices; payroll; advances; audit documents"><div class="fs"></div><div class="fl">4. Finance</div></button><button class="folder" data-d="Procurement files; quotations; contracts; consultant deliverables; acceptance records"><div class="fs"></div><div class="fl">5. Procurement and contracts</div></button><button class="folder" data-d="Asset register; physical verification; transfer approvals; handover forms; disposal records"><div class="fs"></div><div class="fl">6. Assets and inventory</div></button><button class="folder" data-d="Feedback summaries; referral records; closure communication; restricted safeguarding records"><div class="fs"></div><div class="fl">7. Accountability and safeguarding</div></button><button class="folder" data-d="Final narrative report; final financial report; final indicator table; donor feedback; formal acceptance"><div class="fs"></div><div class="fl">8. Final reports and acceptance</div></button><button class="folder" data-d="Exit plan; handover records; sustainability arrangements; outstanding-action tracker"><div class="fs"></div><div class="fl">9. Exit and sustainability</div></button><button class="folder" data-d="Lessons learned; case studies; success stories; approved communication materials"><div class="fs"></div><div class="fl">10. Learning and communication</div></button></div><div class="folderout" id="folderOut">Click a folder to display examples of documents within it.</div>`,n:'Click several folders and ask whether documents are missing for the participants’ context. Keep restricted safeguarding records separate with controlled access. Time: 7 minutes.'},
{t:'What should each folder contain?',time:'6 min',b:`<div class="acc"><details><summary>Agreement and approvals</summary><ul><li>Signed agreement</li><li>Approved proposal</li><li>Budget</li><li>Logframe</li><li>Amendments</li><li>Donor approvals</li></ul></details><details><summary>Programmatic implementation</summary><ul><li>Workplans</li><li>Activity reports</li><li>Attendance sheets</li><li>Distribution records</li><li>Monitoring reports</li><li>Deliverables</li></ul></details><details><summary>MEAL and results</summary><ul><li>MEAL plan</li><li>Indicator definitions</li><li>Beneficiary database</li><li>Tools and datasets</li><li>Data-quality checks</li><li>Evaluation or final review</li></ul></details><details><summary>Finance</summary><ul><li>Financial reports</li><li>Ledger</li><li>Bank reconciliation</li><li>Invoices</li><li>Payroll</li><li>Advances</li><li>Audit documents</li></ul></details><details><summary>Contracts and procurement</summary><ul><li>Procurement files</li><li>Quotations</li><li>Contracts</li><li>Consultant deliverables</li><li>Acceptance records</li></ul></details><details><summary>Assets</summary><ul><li>Asset register</li><li>Physical verification</li><li>Transfer approvals</li><li>Handover forms</li><li>Disposal records</li></ul></details><details><summary>Accountability and safeguarding</summary><ul><li>Feedback summaries</li><li>Referral records</li><li>Closure communication</li><li>Restricted safeguarding records</li></ul></details><details><summary>Final reporting</summary><ul><li>Final narrative report</li><li>Final financial report</li><li>Final indicator table</li><li>Donor feedback</li><li>Formal acceptance</li></ul></details><details><summary>Exit and sustainability</summary><ul><li>Exit plan</li><li>Handover records</li><li>Sustainability arrangements</li><li>Outstanding-action tracker</li></ul></details><details><summary>Learning and communications</summary><ul><li>Lessons learned</li><li>Case studies</li><li>Success stories</li><li>Approved communication materials</li></ul></details></div>`,n:'Open an accordion section and ask who owns its completion. Folder content should reflect the agreement, policy and project risks. Time: 6 minutes.'},
{t:'Can someone find the correct document quickly?',time:'5 min',cls:'soft',b:`<code>Project_Activity_DocumentType_Location_Date_Version</code><p class="big" style="font-size:clamp(19px,1.7vw,27px);margin-top:14px">Livelihoods_Training_AttendanceSheet_Assuit_2026-06-15_Final</p><div class="compare"><div class="side weak"><h3>Avoid</h3><p>Final • New final • Final 2 • Final final • Latest version</p></div><div class="side strongside"><h3>Use</h3><p>Version number • Approval status • Clear date • Clear document type • Named location or activity</p></div></div>`,c:'Source: ICRC, Archives Acquisition Policy.',n:'Explain how consistent names and version controls reduce errors and retrieval time. Time: 5 minutes.'},
{t:'How long should project records be retained?',time:'5 min',b:`<p class="big">There is no single retention period for every project.</p><div class="g4"><div class="card">1. Donor agreement</div><div class="card">2. Organizational policy</div><div class="card">3. National law</div><div class="card">4. Audit, investigation or legal requirements</div></div><div class="g2" style="margin-top:14px"><div class="card teal"><h3>Donor-specific example: UNHCR</h3><p>Funded partners: at least six years after closure, according to current UNHCR partnership guidance.</p></div><div class="card green"><h3>Donor-specific example: EU</h3><p>Many EU grants: commonly at least five years after payment of the final balance, subject to the specific grant agreement and any ongoing audit or legal process.</p></div></div><div class="strip bad">These are donor examples, not universal retention periods. Always check the signed agreement.</div>`,c:'Sources: UNHCR, Funded Partnership Management Guidance; European Commission, Annotated Grant Agreement.',n:'Stress that retention is agreement- and context-specific. An audit, investigation or legal process may extend the period. Time: 5 minutes.'},
{t:'Do not leave beneficiary data behind',time:'6 min',cls:'soft',b:`<div class="compare"><div class="side weak"><h3>Common risks</h3><ul><li>Files on personal laptops</li><li>Data shared through personal email</li><li>Former staff retaining access</li><li>Unprotected databases</li><li>Sensitive records in general folders</li><li>Data retained without a clear purpose</li><li>Backups forgotten during deletion</li></ul></div><div class="side strongside"><h3>Required actions</h3><ul><li>Identify sensitive datasets</li><li>Restrict access</li><li>Remove former staff access</li><li>Transfer records securely</li><li>Anonymize where possible</li><li>Retain only what is required</li><li>Securely destroy unnecessary records and backups</li></ul></div></div>`,c:'Source: ICRC, Rules on Personal Data Protection.',n:'Review data across drives, laptops, phones, email and backups. Explain secure transfer, access removal, retention and destruction. Time: 6 minutes.'},
{t:'Closure risk challenge',time:'10 min',a:1,b:`<div class="def">A livelihoods project ends in two weeks. The team has completed most activities, but several issues remain.</div><div class="g5" style="margin-top:18px"><div class="card"><h3>1</h3><p>What are the main risks?</p></div><div class="card"><h3>2</h3><p>Which actions are urgent?</p></div><div class="card"><h3>3</h3><p>Who should be responsible?</p></div><div class="card"><h3>4</h3><p>What evidence is required?</p></div><div class="card"><h3>5</h3><p>Which issues could prevent formal closure?</p></div></div><div class="strip push">2 minutes for explanation • 8 minutes for breakout-room or chat discussion</div>`,n:'Assign breakout rooms or use the main chat. Ask each group to nominate a spokesperson and answer the five questions. Time: 2 minutes explanation and 8 minutes discussion.'},
{t:'What needs to be resolved?',time:'Group exercise',a:1,cls:'soft',b:`<div class="scenario"><button>1. Attendance sheets for three trainings are missing.</button><button>2. The database reports 620 participants.</button><button>3. The final report reports 680 participants.</button><button>4. Fifteen beneficiaries appear twice.</button><button>5. A consultant invoice is pending, but the deliverable has not been approved.</button><button>6. Two staff advances remain uncleared.</button><button>7. Ten tablets are still with field staff.</button><button>8. Sewing machines may be transferred without donor approval.</button><button>9. The complaints hotline will stop.</button><button>10. Three safeguarding referrals remain open.</button><button>11. Beneficiary data are stored on personal laptops.</button><button>12. No partner exit meeting or lessons-learned session has occurred.</button></div><p class="muted push">Click cards to mark issues discussed by the group.</p>`,n:'The scenario combines programmatic, MEAL, finance, assets, accountability, safeguarding, data and learning risks. Time: included in the group exercise.'},
{t:'Suggested closure actions',time:'7 min',b:`<table><thead><tr><th>Issue</th><th>Risk</th><th>Required action</th><th>Responsible function</th></tr></thead><tbody><tr><td>Missing attendance sheets</td><td>Unverifiable results</td><td>Retrieve evidence or identify acceptable alternative evidence</td><td>Program and MEAL</td></tr><tr><td>Conflicting participant totals</td><td>Inaccurate reporting</td><td>Reconcile database and report</td><td>MEAL</td></tr><tr><td>Duplicate records</td><td>Over-reporting</td><td>Deduplicate and document the process</td><td>MEAL</td></tr><tr><td>Unapproved consultant deliverable</td><td>Ineligible payment</td><td>Review and approve before payment</td><td>Program and finance</td></tr><tr><td>Uncleared advances</td><td>Financial exposure</td><td>Clear advances</td><td>Finance</td></tr><tr><td>Tablets with staff</td><td>Asset loss</td><td>Verify and recover assets</td><td>Administration</td></tr><tr><td>Unauthorized asset transfer</td><td>Compliance risk</td><td>Obtain donor approval and signed handover</td><td>Management and administration</td></tr><tr><td>Hotline closure</td><td>Accountability gap</td><td>Inform communities and provide alternative channels</td><td>Accountability focal point</td></tr><tr><td>Open safeguarding referrals</td><td>Protection risk</td><td>Confidential case handover</td><td>Safeguarding focal point</td></tr><tr><td>Data on personal laptops</td><td>Data breach</td><td>Transfer securely and remove copies</td><td>MEAL and IT</td></tr><tr><td>No partner exit meeting</td><td>Sustainability risk</td><td>Conduct documented handover</td><td>Project manager</td></tr><tr><td>No lessons learned</td><td>Loss of knowledge</td><td>Facilitate final reflection</td><td>Project manager and MEAL</td></tr></tbody></table>`,n:'Compare group priorities with the suggested action, owner and evidence for each issue. Time: 7 minutes.'},
{t:'Is the project ready to close?',time:'6 min',a:1,cls:'soft',b:`<div class="checks" id="checks"><div class="cg"><h3>Programmatic</h3><label class="ci"><input type="checkbox">Activities completed or explained</label><label class="ci"><input type="checkbox">Deliverables submitted</label><label class="ci"><input type="checkbox">Changes approved</label><label class="ci"><input type="checkbox">Final report completed</label><label class="ci"><input type="checkbox">Stakeholders informed</label></div><div class="cg"><h3>MEAL</h3><label class="ci"><input type="checkbox">Results verified</label><label class="ci"><input type="checkbox">Beneficiary data cleaned</label><label class="ci"><input type="checkbox">Duplicates removed</label><label class="ci"><input type="checkbox">Indicator table finalized</label><label class="ci"><input type="checkbox">Limitations documented</label><label class="ci"><input type="checkbox">Learning captured</label></div><div class="cg"><h3>Financial</h3><label class="ci"><input type="checkbox">Advances cleared</label><label class="ci"><input type="checkbox">Balances reconciled</label><label class="ci"><input type="checkbox">Liabilities settled</label><label class="ci"><input type="checkbox">Variances explained</label><label class="ci"><input type="checkbox">Final financial report completed</label></div><div class="cg"><h3>Contracts and staff</h3><label class="ci"><input type="checkbox">Deliverables accepted</label><label class="ci"><input type="checkbox">Contracts closed</label><label class="ci"><input type="checkbox">Handover notes completed</label><label class="ci"><input type="checkbox">Equipment returned</label><label class="ci"><input type="checkbox">System access reviewed</label></div><div class="cg"><h3>Assets</h3><label class="ci"><input type="checkbox">Inventory updated</label><label class="ci"><input type="checkbox">Assets physically verified</label><label class="ci"><input type="checkbox">Transfer decisions approved</label><label class="ci"><input type="checkbox">Handover evidence signed</label></div><div class="cg"><h3>Community and safeguarding</h3><label class="ci"><input type="checkbox">Communities informed</label><label class="ci"><input type="checkbox">Referral responsibilities transferred</label><label class="ci"><input type="checkbox">Complaint channels closed or transferred</label><label class="ci"><input type="checkbox">Safeguarding issues addressed</label></div><div class="cg" style="grid-column:span 2"><h3>Documentation</h3><label class="ci"><input type="checkbox">Folder structure completed</label><label class="ci"><input type="checkbox">Final versions identified</label><label class="ci"><input type="checkbox">Retention period confirmed</label><label class="ci"><input type="checkbox">Sensitive data protected</label><label class="ci"><input type="checkbox">Backup completed</label></div></div><div class="tools"><button class="btn warn" id="clearChecks">Reset checklist</button><button class="btn" onclick="print()">Print checklist</button><button class="btn alt" id="exportChecks">Export checklist summary as text</button></div>`,n:'Use the checklist as a cross-functional readiness review. Ask participants to tick practices they already apply and identify the biggest gap. Time: 6 minutes.'},
{t:'What will your organization do next?',time:'5 min',a:1,b:`<p>Identify at least three actions you will apply to a current or upcoming project.</p><table class="action"><thead><tr><th>Action required</th><th>Responsible person</th><th>Deadline</th><th>Evidence of completion</th></tr></thead><tbody>${Array(5).fill(0).map((_,i)=>`<tr><td><input aria-label="Action ${i+1}"></td><td><input aria-label="Responsible person ${i+1}"></td><td><input type="date" aria-label="Deadline ${i+1}"></td><td><input aria-label="Evidence ${i+1}"></td></tr>`).join('')}</tbody></table><div class="tools"><button class="btn alt" id="downloadPlan">Download my action plan</button><button class="btn" onclick="print()">Print my action plan</button></div>`,n:'Give quiet time to enter at least three actions. Example: create a standard closure folder, assign an owner, deadline and evidence. Time: 5 minutes.'},
{t:'Five closure principles',time:'4 min',cls:'center soft',b:`<div id="principles" style="width:100%"><div class="principle show">1. Closure should be planned before the final project month.</div><div class="principle">2. Every reported result must have accessible and verifiable evidence.</div><div class="principle">3. Programmatic, MEAL and financial records must tell the same story.</div><div class="principle">4. Communities, partners, staff, assets and sensitive data must be handled responsibly.</div><div class="principle">5. A project is not fully closed until obligations are completed, records are organized and responsibilities are formally handed over.</div></div><div class="tools"><button class="btn" id="pBack">Previous message</button><button class="btn alt" id="pNext">Next message</button></div>`,n:'Reveal one principle at a time and connect each to an earlier slide. Time: 4 minutes.'},
{t:'One action I will take after this session',time:'3 min',a:1,cls:'center',b:`<p>Write one project-closure practice you will improve in your organization.</p><textarea class="reflection" placeholder="Type your commitment here..." aria-label="Final personal commitment"></textarea><div class="strip" style="width:100%">Share your answer in the online meeting chat.</div>`,n:'Give one minute to write, then invite several chat responses. Time: 3 minutes.'},
{t:'Key international guidance used in this session',b:`<div class="refs"><div class="ref"><b>1. UNDP.</b> Close and Transition of a Development Project: Visual Guide.<br><a href="https://popp.undp.org/document/1361/download/en">https://popp.undp.org/document/1361/download/en</a></div><div class="ref"><b>2. UNDP.</b> Close and Transition Policy and Procedures.<br><a href="https://popp.undp.org/policy-page/close-and-transition">https://popp.undp.org/policy-page/close-and-transition</a></div><div class="ref"><b>3. UNHCR.</b> Programme Handbook for Partners: Project Closure.<br><a href="https://www.unhcr.org/handbooks/programme-partnerhub/unhcr-programme-handbook-partners/show-results/show-section-3-project-closure">https://www.unhcr.org/handbooks/programme-partnerhub/unhcr-programme-handbook-partners/show-results/show-section-3-project-closure</a></div><div class="ref"><b>4. FCDO.</b> Programme Operating Framework.<br><a href="https://www.gov.uk/government/publications/fcdo-programme-operating-framework/fcdo-programme-operating-framework-overview">https://www.gov.uk/government/publications/fcdo-programme-operating-framework/fcdo-programme-operating-framework-overview</a></div><div class="ref"><b>5. European Commission.</b> Annotated Grant Agreement.<br><a href="https://ec.europa.eu/info/funding-tenders/opportunities/docs/2021-2027/common/guidance/aga_en.pdf">https://ec.europa.eu/info/funding-tenders/opportunities/docs/2021-2027/common/guidance/aga_en.pdf</a></div><div class="ref"><b>6. IFRC.</b> Project/Programme Monitoring and Evaluation Guide.<br><a href="https://www.ifrc.org/sites/default/files/2024-06/Project-programme%20monitoring%20and%20evaluation%20guide_IFRC.pdf">https://www.ifrc.org/sites/default/files/2024-06/Project-programme%20monitoring%20and%20evaluation%20guide_IFRC.pdf</a></div><div class="ref"><b>7. OECD DAC.</b> Better Criteria for Better Evaluation.<br><a href="https://one.oecd.org/document/DCD/DAC%282019%2958/FINAL/en/pdf">https://one.oecd.org/document/DCD/DAC%282019%2958/FINAL/en/pdf</a></div><div class="ref"><b>8. ICRC.</b> Archives Acquisition Policy.<br><a href="https://www.icrc.org/sites/default/files/2025-05/4870_002_ICRC_Archives_Acquisition_Policy_WEB.pdf">https://www.icrc.org/sites/default/files/2025-05/4870_002_ICRC_Archives_Acquisition_Policy_WEB.pdf</a></div><div class="ref"><b>9. ICRC.</b> Rules on Personal Data Protection.<br><a href="https://www.icrc.org/en/download/file/247096/annex_4_-_the_icrc_rules_on_personal_data_protection.pdf">https://www.icrc.org/en/download/file/247096/annex_4_-_the_icrc_rules_on_personal_data_protection.pdf</a></div><div class="ref"><b>10. UNHCR.</b> Guidance Note on Funded Partnership Management.<br><a href="https://www.unhcr.org/handbooks/programme-partnerhub/sites/pph/files/2025-07/Guidance%20Note%20on%20UNHCR%20Funded%20Partnership%20Management%20_EN.pdf">https://www.unhcr.org/handbooks/programme-partnerhub/sites/pph/files/2025-07/Guidance%20Note%20on%20UNHCR%20Funded%20Partnership%20Management%20_EN.pdf</a></div></div>`,n:'Use this as a reference slide. Remind participants that donor-specific requirements must be checked against the signed agreement.'},

const deck=document.getElementById('deck');S.forEach((s,i)=>{const x=document.createElement('section');x.className='slide '+(s.cls||'')+(i===0?' on':'');x.dataset.i=i;x.innerHTML=`<span class="time">${s.time||''}</span><div class="head"><h2>${i===0?'':s.t}</h2>${s.a?'<span class="act">Participant activity</span>':''}</div>${s.b}${s.c?`<div class="cite">${s.c}</div>`:''}`;deck.insertBefore(x,document.getElementById('notes'))});
const slides=[...document.querySelectorAll('.slide')];let cur=0;function show(i){cur=Math.max(0,Math.min(i,slides.length-1));slides.forEach((x,j)=>x.classList.toggle('on',j===cur));document.getElementById('count').textContent=`${cur+1} / ${slides.length}`;document.getElementById('fill').style.width=`${(cur+1)/slides.length*100}%`;document.getElementById('noteText').textContent=S[cur].n||'';document.title=`${cur+1}/${slides.length} — ${S[cur].t}`;bind()}document.getElementById('prev').onclick=()=>show(cur-1);document.getElementById('next').onclick=()=>show(cur+1);document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(e.target.tagName)||e.target.isContentEditable)return;if(e.key==='ArrowRight'||e.key==='PageDown')show(cur+1);if(e.key==='ArrowLeft'||e.key==='PageUp')show(cur-1);if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1)});
const notes=document.getElementById('notes');document.getElementById('noteBtn').onclick=()=>notes.classList.toggle('open');document.getElementById('closeNotes').onclick=()=>notes.classList.remove('open');document.getElementById('full').onclick=async()=>{try{document.fullscreenElement?await document.exitFullscreen():await document.documentElement.requestFullscreen()}catch(e){alert('Full-screen mode is unavailable in this browser context.')}};
let elapsed=0,tid=null,started=0;const timer=document.getElementById('timer');function fmt(ms){let s=Math.floor(ms/1000),h=String(Math.floor(s/3600)).padStart(2,'0'),m=String(Math.floor(s%3600/60)).padStart(2,'0'),x=String(s%60).padStart(2,'0');return`${h}:${m}:${x}`}function tick(){timer.textContent=fmt(elapsed+(tid?Date.now()-started:0))}document.getElementById('start').onclick=()=>{if(!tid){started=Date.now();tid=setInterval(tick,250)}};document.getElementById('pause').onclick=()=>{if(tid){elapsed+=Date.now()-started;clearInterval(tid);tid=null;tick()}};document.getElementById('reset').onclick=()=>{clearInterval(tid);tid=null;elapsed=0;tick()};
function dl(name,text){const u=URL.createObjectURL(new Blob([text],{type:'text/plain'})),a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}function bind(){const q=slides[cur];q.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{q.querySelectorAll('[data-p]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');q.querySelector('#pollStatus').textContent='Your response: '+b.dataset.p;q.querySelector('#pollReveal').style.display='block'});q.querySelectorAll('.folder').forEach(f=>f.onclick=()=>{q.querySelectorAll('.folder').forEach(x=>x.classList.remove('active'));f.classList.add('active');q.querySelector('#folderOut').innerHTML='<b>'+f.querySelector('.fl').textContent+':</b> '+f.dataset.d.replaceAll(';',' •')});q.querySelectorAll('.scenario button').forEach(b=>b.onclick=()=>b.classList.toggle('sel'));const cc=q.querySelector('#clearChecks');if(cc)cc.onclick=()=>q.querySelectorAll('#checks input').forEach(x=>x.checked=false);const ec=q.querySelector('#exportChecks');if(ec)ec.onclick=()=>{let t='PROJECT CLOSURE CHECKLIST\n\n';q.querySelectorAll('.cg').forEach(g=>{t+=g.querySelector('h3').textContent.toUpperCase()+'\n';g.querySelectorAll('.ci').forEach(l=>t+=(l.querySelector('input').checked?'[x] ':'[ ] ')+l.textContent.trim()+'\n');t+='\n'});dl('project_closure_checklist.txt',t)};const dp=q.querySelector('#downloadPlan');if(dp)dp.onclick=()=>{let t='INDIVIDUAL PROJECT CLOSURE ACTION PLAN\n\n';q.querySelectorAll('.action tbody tr').forEach((r,i)=>{const v=[...r.querySelectorAll('input')].map(x=>x.value);t+=`${i+1}. Action: ${v[0]}\nResponsible: ${v[1]}\nDeadline: ${v[2]}\nEvidence: ${v[3]}\n\n`});dl('project_closure_action_plan.txt',t)};const ps=[...q.querySelectorAll('.principle')];if(ps.length){let p=ps.findIndex(x=>x.classList.contains('show'));const sp=i=>{p=(i+ps.length)%ps.length;ps.forEach((x,j)=>x.classList.toggle('show',j===p))};q.querySelector('#pNext').onclick=()=>sp(p+1);q.querySelector('#pBack').onclick=()=>sp(p-1)}}show(0);tick();
</script></body></html>
